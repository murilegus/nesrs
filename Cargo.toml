[workspace]
resolver = "3"
members = ["crates/nesrs-core", "crates/nesrs"]
default-members = ["crates/nesrs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Murilegus"]
repository = "https://github.com/murilegus/nesrs"

[workspace.lints.rust]
unsafe_code = "forbid"

# The emulator core is far too slow without optimisation, even while debugging.
[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
